<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorry Masego</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            position: relative;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .heart {
            font-size: 80px;
            animation: heartbeat 1.5s ease-in-out infinite;
            margin-bottom: 20px;
            display: inline-block;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .message {
            color: #666;
            font-size: 1.3em;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .love-message {
            color: #e74c3c;
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 40px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #ff6b6b; }
            to { text-shadow: 0 0 20px #ff6b6b, 0 0 30px #ff6b6b; }
        }

        .buttons {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: center;
            position: relative;
            height: 80px;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            position: relative;
        }

        .yes-btn {
            background: linear-gradient(45deg, #11998e, #38ef7d);
            color: white;
            box-shadow: 0 4px 15px rgba(17, 153, 142, 0.4);
        }

        .yes-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(17, 153, 142, 0.6);
        }

        .no-btn {
            background: linear-gradient(45deg, #eb3349, #f45c43);
            color: white;
            box-shadow: 0 4px 15px rgba(235, 51, 73, 0.4);
            position: absolute;
            transition: all 0.2s ease;
        }

        .no-btn:hover {
            transform: scale(1.1);
        }

        .celebration {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #f0f;
            animation: confetti-fall 3s linear forwards;
        }

        @keyframes confetti-fall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        .success-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            z-index: 1001;
            text-align: center;
            animation: popIn 0.5s ease;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0); }
            80% { transform: translate(-50%, -50%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .success-message h2 {
            color: #11998e;
            font-size: 2em;
            margin-bottom: 20px;
        }

        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .floating-heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.3);
            font-size: 30px;
            animation: float-up 10s linear infinite;
        }

        @keyframes float-up {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="floating-hearts" id="floatingHearts"></div>
    
    <div class="container">
        <div class="heart">💝</div>
        <h1>I'm sorry for yesterday<br>Masego</h1>
        <p class="message">Do you forgive me?</p>
        <p class="love-message">I love and miss you very much ❤️</p>
        
        <div class="buttons">
            <button class="yes-btn" onclick="sayYes()">Yes 💚</button>
            <button class="no-btn" id="noBtn" onmouseover="runAway()" onclick="runAway()">No 💔</button>
        </div>
    </div>

    <div class="celebration" id="celebration"></div>
    
    <div class="success-message" id="successMessage">
        <div style="font-size: 60px; margin-bottom: 20px;">🎉</div>
        <h2>Yay! Thank you Masego!</h2>
        <p style="font-size: 1.2em; color: #666;">You're the best! 💕</p>
        <button onclick="location.reload()" style="margin-top: 20px; background: #667eea; color: white; padding: 10px 30px; border-radius: 25px; border: none; cursor: pointer;">Send Love Again</button>
    </div>

    <script>
        // Create floating background hearts
        function createFloatingHearts() {
            const container = document.getElementById('floatingHearts');
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
                heart.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(heart);
            }
        }
        createFloatingHearts();

        // The running away "No" button
        function runAway() {
            const btn = document.getElementById('noBtn');
            const container = document.querySelector('.container');
            const rect = container.getBoundingClientRect();
            
            // Calculate random position within viewport but outside the center area
            const maxX = window.innerWidth - 100;
            const maxY = window.innerHeight - 50;
            
            let newX, newY;
            let attempts = 0;
            
            do {
                newX = Math.random() * maxX;
                newY = Math.random() * maxY;
                attempts++;
            } while (
                attempts < 50 && 
                newX > rect.left - 100 && 
                newX < rect.right + 50 && 
                newY > rect.top - 50 && 
                newY < rect.bottom + 50
            );
            
            btn.style.position = 'fixed';
            btn.style.left = newX + 'px';
            btn.style.top = newY + 'px';
            btn.style.transform = `rotate(${Math.random() * 360}deg) scale(0.8)`;
            
            // Make it shrink slightly each time
            const currentScale = parseFloat(btn.style.transform.match(/scale\(([\d.]+)\)/)?.[1] || 1);
            if (currentScale > 0.3) {
                btn.style.transform = `rotate(${Math.random() * 360}deg) scale(${currentScale - 0.1})`;
            }
        }

        // When she says yes!
        function sayYes() {
            // Create confetti explosion
            const celebration = document.getElementById('celebration');
            const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff', '#5f27cd'];
            
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                celebration.appendChild(confetti);
            }
            
            celebration.style.display = 'block';
            
            // Show success message after brief delay
            setTimeout(() => {
                document.getElementById('successMessage').style.display = 'block';
            }, 500);
            
            // Play a little victory animation on the container
            document.querySelector('.container').style.animation = 'popIn 0.5s ease';
        }

        // Make the No button extra tricky - it runs away even before hover sometimes!
        setInterval(() => {
            const btn = document.getElementById('noBtn');
            const rect = btn.getBoundingClientRect();
            // If it's been still for too long in the center, give it a nudge
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            if (Math.abs(rect.left - centerX) < 200 && Math.abs(rect.top - centerY) < 200) {
                if (Math.random() > 0.7) runAway();
            }
        }, 2000);
    </script>
</body>
</html>
